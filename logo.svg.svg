<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 92" width="402" height="92" role="img" aria-label="Clínica Visão Plena - Oftalmologia Especializada">
  <defs>
    <linearGradient id="visaoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#054A5E" />
      <stop offset="55%" stop-color="#0E8A94" />
      <stop offset="100%" stop-color="#48C9B0" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B2AC" />
      <stop offset="100%" stop-color="#064E63" />
    </linearGradient>
  </defs>

  <!-- Símbolo do Olho + Traços Orgânicos -->
  <g transform="translate(2, 2)">
    <!-- Contorno principal do olho -->
    <path d="M 4,44 Q 48,4 92,44 Q 48,84 4,44 Z" fill="none" stroke="url(#visaoGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Curva superior estilizada -->
    <path d="M 18,26 C 40,2 76,8 90,34" fill="none" stroke="url(#visaoGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Curva inferior estilizada -->
    <path d="M 78,62 C 56,86 20,80 6,54" fill="none" stroke="url(#visaoGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Íris -->
    <circle cx="48" cy="44" r="18" fill="url(#irisGrad)" />
    
    <!-- Pupila -->
    <circle cx="48" cy="44" r="8" fill="#032B38" />
    
    <!-- Ponto de luz (brilho ocular) -->
    <circle cx="53.5" cy="38.5" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Tipografia -->
  <text x="108" y="47" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="800" fill="#054A5E" letter-spacing="0.8">VISÃO PLENA</text>
  <text x="110" y="70" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#1D7A85" letter-spacing="2.1">OFTALMOLOGIA ESPECIALIZADA</text>
</svg>